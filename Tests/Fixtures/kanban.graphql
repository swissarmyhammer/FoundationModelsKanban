  deleteTag(
    """The input object of the call. Its type tells what each field does."""
    input: NodeReferenceInput!
  ): Tag

  """Makes a tombstoned tag live again. A live tag does not change."""
  undeleteTag(
    """The input object of the call. Its type tells what each field does."""
    input: NodeReferenceInput!
  ): Tag

  """
  Renames a tag. The old slug redirects to the new slug, so each task with the old tag shows the new tag. A new slug that a tag has already merges the two tags.
  """
  renameTag(
    """The input object of the call. Its type tells what each field does."""
    input: RenameTagInput!
  ): Tag

  """
  Reverses a transaction: it writes the inverse of each change of the transaction. No txn reverses the newest transaction of the session actor that is not undone, is not an undo or a redo, and comes after the newest collectBoards transaction. A collectBoards transaction cannot be reversed. A later change that conflicts with the inverse gives UNDO_CONFLICT, unless force is true.
  """
  undo(
    """
    The input object of the call. Its type tells what each field does. No field is required, so the call can leave out the input.
    """
    input: UndoInput
  ): Change

  """
  Reverses the undo of a transaction. No txn reverses the newest undo of the session actor that is not undone, is not a redo, and comes after the newest collectBoards transaction.
  """
  redo(
    """
    The input object of the call. Its type tells what each field does. No field is required, so the call can leave out the input.
    """
    input: UndoInput
  ): Change

  """
  Rewrites each OLD_NAME link of the boards to the current name of its board, and lists each OLD_NAME and DANGLING link. A DANGLING link does not change. One undo reverses the rewrite in each board.
  """
  repairLinks(
    """
    The boards whose links to rewrite. Each item is a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value, or an empty list, names the current board. The call writes to no other board, unless reach is true.
    """
    boards: [String!]

    """
    True also rewrites the links of each board that the scan reaches: the boards of Query.boards.
    """
    reach: Boolean

    """True lists the same links and writes nothing."""
    dryRun: Boolean
  ): [LinkRepair!]

  """
  Combines the .kanban folders of the source boards into the target board, the same as a git union merge. Tasks and comments keep their ids. A column, a tag, or an actor with the same slug becomes one node, and the event order decides a field that two boards set. Each name of a source becomes an old name of the target, and the call removes each source .kanban folder. The call rewrites each OLD_NAME link of the target to the current name. Undo does not reverse the call. A board of the old Rust kanban gives INCOMPATIBLE_BOARD and the call writes nothing.
  """
  collectBoards(
    """
    The boards to combine into the target. Each item is a folder that holds a .kanban folder (also a subfolder of a git repo), or a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. A source that is the target is left out.
    """
    sources: [String!]

    """
    The board that gets the sources: a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value names the current board. A target with no board gets a new board with a new board ID. In a git repo, the target is the top folder of the repo.
    """
    target: String

    """
    True also rewrites each link of a different board that the scan reaches and that names a source: the link then names the target. With no value, the call only lists these links in otherLinks.
    """
    reach: Boolean

    """
    True lists the slug merges, the conflicts, and the link repairs, and writes nothing.
    """
    dryRun: Boolean
  ): CollectBoardsResult
}

type Subscription {
  """
  Sends a Change for the transactions that change the board: a call of this tool, or a change that a different process, git pull, or a merge writes. A Change with no update after the filter is not sent. The same type as Board.history, so a client can read history(since:) and then subscribe with the same filter.
  """
  changes(
    """
    The board to observe. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value observes the current board.
    """
    board: String

    """
    The filter of the updates. An update stays when its node matches. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter in history and changes keeps each update, except the updates of a deleted task: of these, only its delete stays. No filter in Change.updates keeps each update of the change.
    """
    filter: String
  ): Change!
}
