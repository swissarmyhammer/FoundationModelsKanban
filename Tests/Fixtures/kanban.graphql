"""The node of deleteTag."""
input DeleteTagInput {
  """The node: a full URI or a short form."""
  id: ID!
}

"""The node of undeleteTag."""
input UndeleteTagInput {
  """The node: a full URI or a short form."""
  id: ID!
}

"""The fields of undoChange."""
input UndoChangeInput {
  """
  For undoChange, the transaction to reverse. For redoChange, the original transaction whose undo to reverse. No txn gives the newest target of the session actor after the newest collectBoards transaction: for undoChange, a transaction that is not undone and is not an undo or a redo; for redoChange, an undo that is not undone and is not a redo.
  """
  txn: ID

  """True writes the inverse also when a later change conflicts with it."""
  force: Boolean

  """
  The board that holds the transaction. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value searches the current board and the loaded related boards.
  """
  board: String

  """
  More copies of the other boards of the transaction to reverse, for example the path of a second worktree of a repo.
  """
  boards: [String!]
}

"""The fields of redoChange."""
input RedoChangeInput {
  """
  For undoChange, the transaction to reverse. For redoChange, the original transaction whose undo to reverse. No txn gives the newest target of the session actor after the newest collectBoards transaction: for undoChange, a transaction that is not undone and is not an undo or a redo; for redoChange, an undo that is not undone and is not a redo.
  """
  txn: ID

  """True writes the inverse also when a later change conflicts with it."""
  force: Boolean

  """
  The board that holds the transaction. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value searches the current board and the loaded related boards.
  """
  board: String

  """
  More copies of the other boards of the transaction to reverse, for example the path of a second worktree of a repo.
  """
  boards: [String!]
}

"""
One stored link that repairLinks or collectBoards reports, and its new target. A dangling link has no new target and does not change.
"""
type LinkRepair {
  """The current key of the board that holds the link."""
  board: String!

  """The full URI of the task that holds the link."""
  node: ID!

  """
  Where the task holds the link: DEPENDS_ON, ASSIGNEE, BODY (a task URL in the body), or TOMBSTONE (the line of a moved task).
  """
  field: LinkField!

  """
  The target of the link as a full kanban:// URI. A dependsOn link that the board stores with no board key gets the current key of the board.
  """
  target: String!

  """
  OK: the link names its board by a name that is not an old name, and the board has the node or cannot be read. OLD_NAME: the same, with an old name of the board. DANGLING: no reachable board has the name. MISSING_NODE: the board is found, and it does not have the node.
  """
  status: LinkStatus!

  """
  The current key of the board that the link names. Null for a DANGLING link.
  """
  currentName: String

  """
  The link after the rewrite: the full kanban:// URI with the current name of its board. Null for a DANGLING link, which does not change.
  """
  newTarget: String
}

"""
The fields of repairLinks. No field is required: input: {} rewrites the links of the current board.
"""
input RepairLinksInput {
  """
  The boards whose links to rewrite. Each item is a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value, or an empty list, names the current board. The call writes to no other board, unless reach is true.
  """
  boards: [String!]

  """
  True also rewrites the links of each board that the scan reaches: the boards of Query.boards.
  """
  reach: Boolean

  """True lists the same links and writes nothing."""
  dryRun: Boolean
}

"""One source board of collectBoards."""
type CollectedBoard {
  """The folder of the source board."""
  path: String!

  """
  The names of the source board, each one time: the key that the board ref of the call gave, its board IDs, its git key, and its old names.
  """
  names: [String!]!
}

"""
One column, tag, or actor that more than one board has. It is one node in the target now.
"""
type SlugMerge {
  """The full URI of the node in the target board."""
  node: ID!

  """The folder of each board that has the node, the target first."""
  boards: [String!]!
}

"""
One field of a node that two or more boards set to different values. The winner is the value after the merge of the events of all the boards.
"""
type FieldConflict {
  """The full URI of the node in the target board."""
  node: ID!

  """The name of the field, for example name, or body."""
  field: String!

  """The value that each board gives the field, each one time."""
  values: [String!]!

  """
  The value after the collect: the merge of the events of all the boards. Null when a property has no value. An empty body gives the empty text.
  """
  winner: String
}

"""
The result of collectBoards: the target, the sources, the merges, and the links.
"""
type CollectBoardsResult {
  """The current key of the target board."""
  target: String!

  """
  Each source board: its folder and its names, which are old names of the target.
  """
  sources: [CollectedBoard!]!

  """
  Each column, tag, and actor that more than one board has: one node now.
  """
  slugMerges: [SlugMerge!]!

  """
  Each field that two or more boards set to different values, and the winner.
  """
  conflicts: [FieldConflict!]!

  """
  The OLD_NAME and DANGLING links of the target after the merge, and with reach also the links of otherLinks. A DANGLING link has no new target and does not change.
  """
  repairs: [LinkRepair!]!

  """
  Each link of a different board that the scan reaches, that names a source by a name that is an old name of the target after the merge, and whose node the target has. Only reach rewrites these links.
  """
  otherLinks: [LinkCheck!]!

  """True for a dry run: the call wrote nothing."""
  dryRun: Boolean!
}

"""
The fields of collectBoards. No field is required: no sources collects no board.
"""
input CollectBoardsInput {
  """
  The boards to combine into the target. Each item is a folder that holds a .kanban folder (also a subfolder of a git repo), or a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. A source that is the target is left out.
  """
  sources: [String!]

  """
  The board that gets the sources: a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value names the current board. A target with no board gets a new board with a new board ID. In a git repo, the target is the top folder of the repo.
  """
  target: String

  """
  True also rewrites each link of otherLinks: the link then names the target by its current key. Otherwise the call only lists these links.
  """
  reach: Boolean

  """
  True lists the slug merges, the conflicts, and the link repairs, and writes nothing.
  """
  dryRun: Boolean
}

type Query {
  """
  One board: the current board, or the board that id names. The board of a different repo is read from its .kanban folder.
  """
  board(
    """
    The board to read. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value reads the current board.
    """
    id: String
  ): Board

  """
  One node of any type by its id, live or deleted. Null when no node has the id. A full URI of a different board reads that board.
  """
  node(
    """The id of the node: its full kanban:// URI, or a short form."""
    id: ID!
  ): Node

  """
  The nodes of the ids, in the order of the ids, live or deleted. An id that names no node is not in the list.
  """
  nodes(
    """
    The ids of the nodes. Each id is a full kanban:// URI, or a short form.
    """
    ids: [ID!]!
  ): [Node!]

  """
  Each board that the scan finds, with its path, in scan order: each repo or board folder one level down in the parent folder of the current repo, the current repo included, then in each search root of the config. A board that cannot be read is not in the list, and the response gives a warning that names it.
  """
  boards(
    """
    True lists only the copies that have a board log (.kanban/board.jsonl), false lists only the copies that do not. No value lists each copy.
    """
    enabled: Boolean
  ): [Board!]!

  """
  Reads each stored link of the boards and gives its class. The links are the dependsOn edges, the assignee URIs, and the task URLs in the body of each live task, and the moved line of each tombstone. Reads only.
  """
  checkLinks(
    """
    The boards whose links to check. Each item is a board ref. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value, or an empty list, checks the current board.
    """
    boards: [String!]
  ): [LinkCheck!]

  """
  The cursor of the board as this query reads it. Give it as after to changes to get each change after this read.
  """
  cursor(
    """
    The board of the cursor. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value gives the cursor of the current board.
    """
    board: String
  ): String!
}

type Mutation {
  """
  Makes the board with the default columns todo, doing, review, and done. On a board that exists, it changes only the given fields that differ, and adds no column.
  """
  initBoard(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: InitBoardInput!
  ): Board

  """Changes the name, the model, or the body of the board."""
  updateBoard(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateBoardInput!
  ): Board

  """
  Makes a column. A trigger or next goes into the frontmatter of the body.
  """
  addColumn(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AddColumnInput!
  ): Column

  """
  Changes the name, the order, the body, or the trigger of a column. A trigger or next goes into the frontmatter of the body, and the other lines of the body do not change.
  """
  updateColumn(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateColumnInput!
  ): Column

  """
  Makes the column a tombstone. A column with live tasks gives COLUMN_NOT_EMPTY.
  """
  deleteColumn(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteColumnInput!
  ): Column

  """Makes a tombstoned column live again. A live column does not change."""
  undeleteColumn(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteColumnInput!
  ): Column

  """Makes an actor. The input gives an id, a name, or both."""
  addActor(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AddActorInput!
  ): Actor

  """Changes the name, the color, the avatar, or the body of an actor."""
  updateActor(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateActorInput!
  ): Actor

  """Makes the actor a tombstone."""
  deleteActor(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteActorInput!
  ): Actor

  """Makes a tombstoned actor live again. A live actor does not change."""
  undeleteActor(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteActorInput!
  ): Actor

  """
  Makes a task. The task goes to the end of its column, unless a priority moves it to the top. An ordinal gives the place when the priority makes no move. A priority that moves the task wins over the ordinal.
  """
  addTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AddTaskInput!
  ): Task

  """
  Changes the given fields of a task. A list replaces the old list. A column moves the task to the end of that column, or to the top when the priority moves it there. An ifVersion that is not the current version of the task gives STALE_WRITE, and the call writes nothing.
  """
  updateTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateTaskInput!
  ): Task

  """
  Moves a task to a column and to a place in that column. No place puts the task at the end of the column. A board field that names a different board moves the task to that board.
  """
  moveTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: MoveTaskInput!
  ): Task

  """Moves a task to the end of the terminal column."""
  completeTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: CompleteTaskInput!
  ): Task

  """Adds an actor to the assignees of a task."""
  assignTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AssignTaskInput!
  ): Task

  """Removes an actor from the assignees of a task."""
  unassignTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UnassignTaskInput!
  ): Task

  """Adds tags to a task. A tag that the board does not have is made."""
  tagTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: TagTaskInput!
  ): Task

  """Removes tags from a task: the tag edges, and the #markers of the body."""
  untagTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UntagTaskInput!
  ): Task

  """Makes the task a tombstone."""
  deleteTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteTaskInput!
  ): Task

  """Makes a tombstoned task live again. A live task does not change."""
  undeleteTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteTaskInput!
  ): Task

  """
  Moves a list of tasks to a column, as one block at one place in that column, in the order of the list. No place puts the tasks at the end of the column. The call is one transaction, so one undoChange reverses it. When a ref names no task, the call writes nothing, and the error names each such ref.
  """
  moveTasks(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: MoveTasksInput!
  ): [Task!]

  """
  Makes each task of a list a tombstone. The call is one transaction, so one undoChange reverses it. When a ref names no task, the call writes nothing, and the error names each such ref.
  """
  deleteTasks(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteTasksInput!
  ): [Task!]

  """
  Makes each tombstoned task of a list live again. A live task does not change. The call is one transaction, so one undoChange reverses it. When a ref names no task, the call writes nothing, and the error names each such ref.
  """
  undeleteTasks(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteTasksInput!
  ): [Task!]

  """
  Copies a task to a column and to a place in that column, in the same board or in a different board. No board field copies the task in its board.
  """
  copyTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: CopyTaskInput!
  ): Task

  """Adds a comment to a task."""
  addComment(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AddCommentInput!
  ): Comment

  """Changes the body of a comment."""
  updateComment(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateCommentInput!
  ): Comment

  """Makes the comment a tombstone."""
  deleteComment(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteCommentInput!
  ): Comment

  """Makes a tombstoned comment live again. A live comment does not change."""
  undeleteComment(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteCommentInput!
  ): Comment

  """
  Sends a task back with a comment to the agent: the review verb "reject with a comment". The call adds the comment to the task, with the session actor as the author, and moves the task, in one transaction, so one undoChange reverses both. No column moves the task to the column before the column where it shows, for example from done to review. No place puts the task at the end of the column.
  """
  rejectTask(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: RejectTaskInput!
  ): Task

  """
  Makes a tag. When the board has a tag with the slug, the call writes no name, color, or body: it follows the rename redirect, gives the tag at the end of the rename chain, and makes that tag live again when it is a tombstone.
  """
  addTag(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: AddTagInput!
  ): Tag

  """
  Changes the name, the color, or the body of a tag. A name with a new slug renames the tag, the same as renameTag.
  """
  updateTag(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UpdateTagInput!
  ): Tag

  """Makes the tag a tombstone."""
  deleteTag(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: DeleteTagInput!
  ): Tag

  """Makes a tombstoned tag live again. A live tag does not change."""
  undeleteTag(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndeleteTagInput!
  ): Tag

  """
  Renames a tag. The old slug redirects to the new slug, so each task with the old tag shows the new tag. A new slug that a tag has already merges the two tags.
  """
  renameTag(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: RenameTagInput!
  ): Tag

  """
  Reverses a transaction: it writes the inverse of each change of the transaction. No txn reverses the newest transaction of the session actor that is not undone, is not an undo or a redo, and comes after the newest collectBoards transaction. A collectBoards transaction cannot be reversed. A later change that conflicts with the inverse gives UNDO_CONFLICT, unless force is true.
  """
  undoChange(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: UndoChangeInput!
  ): Change

  """
  Reverses the undo of a transaction. No txn reverses the newest undo of the session actor that is not undone, is not a redo, and comes after the newest collectBoards transaction.
  """
  redoChange(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: RedoChangeInput!
  ): Change

  """
  Rewrites each OLD_NAME link of the boards to the current name of its board, and lists each OLD_NAME and DANGLING link. A DANGLING link does not change. One undoChange reverses the rewrite in each board.
  """
  repairLinks(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: RepairLinksInput!
  ): [LinkRepair!]

  """
  Combines the .kanban folders of the source boards into the target board, the same as a git union merge. Tasks and comments keep their ids. A column, a tag, or an actor with the same slug becomes one node, and the event order decides a field that two boards set. Each name of a source becomes an old name of the target, and the call removes each source .kanban folder. The call rewrites each OLD_NAME link of the target to the current name. undoChange does not reverse the call. A board of the old Rust kanban gives INCOMPATIBLE_BOARD and the call writes nothing.
  """
  collectBoards(
    """
    The input object of the call. Its type tells what each field does. The input is required: a call that sets no field sends input: {}.
    """
    input: CollectBoardsInput!
  ): CollectBoardsResult
}

type Subscription {
  """
  Sends a Change for each new transaction of the board: a call of this tool, or a change that a different process, git pull, or a merge writes. A transaction of a different board can also give a Change, with the updates of the nodes of this board. A Change with no update after the filter is not sent. The same type as Board.history, so a client can read history(since:) and then subscribe with the same filter.
  """
  changes(
    """
    A cursor of a query or of a Change. The subscription first sends each change after it, then each new change. A cursor whose changes the board no longer keeps, a cursor from before a restart, and a cursor after the newest change end the subscription with RESYNC_REQUIRED: query again for a new cursor. No value sends only the new changes.
    """
    after: String

    """
    The board to observe. A board key, a repo directory name, a repo path, or a kanban://<board-key> URI. No value observes the current board.
    """
    board: String

    """
    The filter of the updates. An update stays when its node matches. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter in history and changes keeps each update, except the updates of a deleted task: of these, only its delete stays. No filter in Change.updates keeps each update of the change.
    """
    filter: String
  ): Change!
}
