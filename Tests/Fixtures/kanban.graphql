"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""
A priority value of a task input: text, a word, a number, or a Boolean. The board stores no priority: urgent, critical, high, p0, p1, or true moves the task to the top of its column; low, p3, or p4 moves it to the end; each other value keeps its place. The case does not matter.
"""
scalar Priority

"""
A node of the graph: a board, a column, an actor, a tag, a task, or a comment. Each node has a Markdown body.
"""
interface Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime
}

"""
A kanban board: the root of its columns, actors, tags, and tasks. The events of the board are in the .kanban folder of its repo.
"""
type Board implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """
  The current key of the board, for example github.com/owner/repo. The kanban:// URI of each node of the board starts with it.
  """
  key: String!

  """
  The primary board ID of the board: the lowest board ID in its log, as a ULID. A URI with the bare board ID, kanban://<board-id>/<type>/<id>, names this board. Null when the board has no ID yet: the next write of the board gives it one.
  """
  boardId: String

  """
  Each name of the board: the current key first, then each board ID, then each old git key of the board. A board ref or a URI with any of these names names this board.
  """
  names: [String!]!

  """The display name of the board."""
  name: String!

  """
  The model of the board as text, for example the chat model haiku, or null. The board does not check the text.
  """
  model: String

  """
  The live columns, in board order: the first column first, the terminal column last.
  """
  columns: [Column!]!

  """The live actors of the board."""
  actors: [Actor!]!

  """
  The live tags of the board. A renamed tag is not in the list; the tag of its new name is.
  """
  tags: [Tag!]!

  """
  One live task of the board by its id: its ULID, a ULID prefix, ^<short id>, its title slug, task/<ULID>, or the full kanban:// URI. Null, with no error, when no live task has the id.
  """
  task(
    """The id of the node: its full kanban:// URI, or a short form."""
    id: ID!
  ): Task

  """
  One live column of the board by its id: its slug, its name, column/<slug>, or the full kanban:// URI. Null, with no error, when no live column has the id.
  """
  column(
    """The id of the node: its full kanban:// URI, or a short form."""
    id: ID!
  ): Column

  """
  One live actor of the board by its id: its slug, its name, actor/<slug>, or the full kanban:// URI. Null, with no error, when no live actor has the id.
  """
  actor(
    """The id of the node: its full kanban:// URI, or a short form."""
    id: ID!
  ): Actor

  """
  One live tag of the board by its id: its slug, its name, tag/<slug>, or the full kanban:// URI. Null, with no error, when no live tag has the id.
  """
  tag(
    """The id of the node: its full kanban:// URI, or a short form."""
    id: ID!
  ): Tag

  """One page of the tasks that the filter selects, in board order."""
  tasks(
    """
    The filter of the tasks. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter gives each live task, done or not. A deleted task shows only when the filter names #DELETED, or has a ^id or a ~task atom.
    """
    filter: String

    """
    The largest number of tasks in the list. A negative value gives no tasks.
    """
    first: Int = 10

    """
    The cursor of the task before the page: the cursor of an edge, which is the id of the task. A short form also works. No value starts the page at the first task.
    """
    after: String
  ): TaskConnection

  """
  The first task in board order that has the READY virtual tag and matches the filter: a live task that is not done, and that no dependency stops. Null when no task is ready.
  """
  nextTask(
    """
    The filter that the next task must match. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ).
    """
    filter: String
  ): Task

  """
  The tasks that best match the query, highest score first. The filter selects the tasks the same as in tasks.
  """
  searchTasks(
    """
    The search text. The search ranks whole words, parts of words, and the meaning.
    """
    query: String!

    """
    The filter of the tasks. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter gives each live task, done or not. A deleted task shows only when the filter names #DELETED, or has a ^id or a ~task atom.
    """
    filter: String

    """
    The largest number of hits in the list. A negative value gives no hits.
    """
    first: Int = 10
  ): [TaskHit!]

  """The counts of the live tasks and of the live actors of the board."""
  summary: BoardSummary!

  """
  Each virtual tag, with its name, color, and description. A virtual tag is not stored: the board calculates it for each task. See Task.virtualTags.
  """
  virtualTags: [VirtualTag!]!

  """
  The root folder of the repo of the board. Null for a board in memory only.
  """
  path: String

  """
  The transactions that changed the board, newest first, that the filter keeps. A change of this call is not in the list.
  """
  history(
    """
    The filter of the updates. An update stays when its node matches. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter in history and changes keeps each update, except the updates of a deleted task: of these, only its delete stays. No filter in Change.updates keeps each update of the change.
    """
    filter: String

    """
    The id of a transaction. The list holds only the transactions after it. No value lists each transaction.
    """
    since: ID

    """
    The largest number of changes in the list. A negative value gives no changes.
    """
    first: Int = 20
  ): [Change!]
}

"""A column of the board. Each live task shows in one column."""
type Column implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """The display name of the column."""
  name: String!

  """
  The sort key of the column on the board. The column with the lowest order is the first column, and the column with the highest order is the terminal column: a task there is done.
  """
  order: Int!

  """
  The number of live tasks in the column. A task whose column is not a live column counts in the first column.
  """
  taskCount: Int!

  """
  The number of live tasks in the column that no dependency stops. A done task can be ready, the same as Task.ready.
  """
  readyCount: Int!

  """The tasks of this node that match the filter, in board order."""
  tasks(
    """
    The filter of the tasks. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter gives each live task, done or not. A deleted task shows only when the filter names #DELETED, or has a ^id or a ~task atom.
    """
    filter: String
  ): [Task!]
}

"""
A person or an agent: an assignee of tasks, and the author of comments.
"""
type Actor implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """The display name."""
  name: String!

  """
  The display color: the text that the last write stored, with no check of its form. A tag with no color gets a fixed color from its slug: 6 hex digits with no #. An actor with no color gives null.
  """
  color: String

  """The tasks of this node that match the filter, in board order."""
  tasks(
    """
    The filter of the tasks. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter gives each live task, done or not. A deleted task shows only when the filter names #DELETED, or has a ^id or a ~task atom.
    """
    filter: String
  ): [Task!]

  """
  The avatar of the actor as text, for example a URL or an emoji. Null when the actor has no avatar.
  """
  avatar: String
}

"""
A label of tasks. A task gets a tag from a tag edge or from a #tag marker in its body.
"""
type Tag implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """The display name."""
  name: String!

  """
  The display color: the text that the last write stored, with no check of its form. A tag with no color gets a fixed color from its slug: 6 hex digits with no #. An actor with no color gives null.
  """
  color: String!

  """The tasks of this node that match the filter, in board order."""
  tasks(
    """
    The filter of the tasks. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter gives each live task, done or not. A deleted task shows only when the filter names #DELETED, or has a ^id or a ~task atom.
    """
    filter: String
  ): [Task!]
}

"""The counts of the live tasks and of the live actors of the board."""
type BoardSummary {
  """The number of live tasks."""
  total: Int!

  """
  The number of live tasks that no dependency stops. A done task can be ready.
  """
  ready: Int!

  """The number of live tasks that a dependency stops: total minus ready."""
  blocked: Int!

  """The number of live tasks in the terminal column."""
  done: Int!

  """
  The part of the live tasks that is done, from 0 to 100, rounded to a whole number. 0 when the board has no live task.
  """
  percent: Int!

  """The number of live actors of the board."""
  totalActors: Int!
}

"""
A tag that the board calculates from the state of each task. The board does not store it.
"""
type VirtualTag {
  """
  The name of the virtual tag, for example READY. A filter atom #name matches it.
  """
  name: String!

  """The display color of the virtual tag: 6 hex digits with no #."""
  color: String!

  """The meaning of the virtual tag in one sentence."""
  description: String!
}

"""
A task of the board: a title, a Markdown body, a column, and links to actors, tags, and other tasks.
"""
type Task implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """
  The short id: the last 7 characters of the ULID, in lowercase. The ref ^<short id> names the node.
  """
  shortId: String!

  """The title of the task."""
  title: String!

  """
  The column where the task shows. A task whose column is not a live column shows in the first column.
  """
  column: Column!

  """
  The place of the task in its column, as a fractional index: the column sorts the tasks by this text.
  """
  ordinal: String!

  """
  The live actors of the task. An actor of a different board is in the list when a loaded board has it.
  """
  assignees: [Actor!]!

  """
  The live tags of the task, from the tag edges and the #tag markers of the body, by slug.
  """
  tags: [Tag!]!

  """
  The live tasks that this task depends on: the dependsOn edges and the task URLs in the body. A task on a different board has a full kanban://<board-key>/task/<id> id. A dependency that no loaded board has is not in this list. See unresolvedDependsOn.
  """
  dependsOn: [Task!]!

  """
  The live tasks that stop this task: each dependency that is not done, or that is in a dependency cycle with this task. The tasks of other boards are in the list. A dependency that cannot resolve is not in this list. See unresolvedDependsOn.
  """
  blockedBy: [Task!]!

  """
  The full kanban:// URI of each dependency that no loaded board has as a task. For example, a URI with a typo, or a task of a repo that is not on this computer. Each one stops the task.
  """
  unresolvedDependsOn: [ID!]!

  """
  True when no dependency stops the task. The column of the task has no effect, so a done task can be ready. The #READY virtual tag gives only the open tasks that are ready.
  """
  ready: Boolean!

  """
  The virtual tags of the task, from its state: READY, BLOCKED, CONFLICT, DELETED, DONE, HIGH, MEDIUM, LOW. A filter can name them, for example #READY.
  """
  virtualTags: [String!]!

  """The counts of the checklist lines of the body."""
  progress: Progress!

  """The live comments of the task, oldest first. Empty for a deleted task."""
  comments: [Comment!]!

  """
  The time of the first change that put the task in a column that is not the first column, the add included. Null when no change did.
  """
  started: DateTime

  """
  The time of the last column move of the task, when the task is now done. Null when the task is not done, or when no change set its column.
  """
  completed: DateTime
}

"""A comment on a task, with its author."""
type Comment implements Node {
  """The full kanban:// URI of the node."""
  id: ID!

  """The Markdown body of the node. Empty when the node has no body."""
  body: String!

  """The time of the first change of the node."""
  created: DateTime!

  """The time of the last change of the node."""
  updated: DateTime!

  """
  The time of the delete. Null for a live node; a value means that the node is deleted.
  """
  deleted: DateTime

  """
  The short id: the last 7 characters of the ULID, in lowercase. The ref ^<short id> names the node.
  """
  shortId: String!

  """The task of the comment, live or deleted."""
  task: Task!

  """The actor that wrote the comment, live or deleted."""
  author: Actor!
}

"""
The counts of the Markdown checklist lines of a task body: an open line is - [ ], a checked line is - [x] or - [X].
"""
type Progress {
  """The number of checklist lines."""
  total: Int!

  """The number of checked checklist lines."""
  completed: Int!

  """
  The part of the checklist that is checked, from 0 to 1. 0 when the body has no checklist line.
  """
  fraction: Float!

  """
  The part of the checklist that is checked, from 0 to 100: fraction times 100.
  """
  percent: Float!
}

"""One page of tasks, with the cursor of each task."""
type TaskConnection {
  """The tasks of the page, each with its cursor."""
  edges: [TaskEdge!]!

  """
  The nodes of the page, in the same order as edges. Use it in place of edges { node } when you do not need the cursor of each node.
  """
  nodes: [Task!]!

  """The place of a page in the full list."""
  pageInfo: PageInfo!

  """The number of tasks in the full list, on all pages."""
  totalCount: Int!
}

"""One task of a page, with its cursor."""
type TaskEdge {
  """The task."""
  node: Task!

  """
  The cursor of the task: its id. Give it as after to get the page after this task.
  """
  cursor: String!
}

"""The place of a page in the full list."""
type PageInfo {
  """True when the full list has tasks before the page."""
  hasPreviousPage: Boolean!

  """True when the full list has tasks after the page."""
  hasNextPage: Boolean!

  """The cursor of the first task of the page. Null for an empty page."""
  startCursor: String

  """The cursor of the last task of the page. Null for an empty page."""
  endCursor: String
}

"""One task that a search found, with its score."""
type TaskHit {
  """The task."""
  task: Task!

  """
  The score of the hit from all signals, from 0 to 1. A higher score is a better match.
  """
  score: Float!

  """The score of each signal. Null when the search gives no signals."""
  signals: SearchSignals
}

"""The score of each signal of one search hit."""
type SearchSignals {
  """The BM25 score: the match of whole words."""
  bm25: Float!

  """
  The trigram score: the match of parts of words, also with typing errors.
  """
  trigram: Float!

  """
  The embedding cosine score: the match of the meaning. Null when the search gives no cosine score, for example with no embedder.
  """
  cosine: Float
}

"""The type of a node."""
enum NodeType {
  """The board."""
  BOARD

  """A column of the board."""
  COLUMN

  """A task."""
  TASK

  """A tag."""
  TAG

  """An actor: a person or an agent that works on tasks."""
  ACTOR

  """A comment on a task."""
  COMMENT
}

"""How a transaction changed a node."""
enum UpdateKind {
  """The transaction made the node."""
  CREATED

  """The transaction changed fields of the node, also derived fields."""
  UPDATED

  """The transaction deleted the node: the node is a tombstone now."""
  DELETED

  """The transaction undeleted the node: the node is live again."""
  RESTORED
}

"""
One transaction. It has an update for each node that the transaction wrote, and for each other live node whose tracked fields changed (see NodeUpdate.fields). When one batch of Subscription.changes holds several transactions, a node has one update only: in the last transaction of the batch that wrote the node, else in the last transaction of the batch.
"""
type Change {
  """
  The ULID of the transaction. Give it as txn to undo to reverse this change, or to redo to reverse its undo. A collectBoards change cannot be reversed.
  """
  txn: ID!

  """The time of the transaction."""
  at: DateTime!

  """The actor that made the transaction."""
  actor: Actor!

  """The names of the mutations of the tool call, for example addTask."""
  ops: [String!]!

  """
  The key of each board that the transaction changed, the board of this change first.
  """
  boards: [String!]!

  """
  True when a later undo or redo that is not undone reverses this transaction.
  """
  undone: Boolean!

  """
  The transaction that this undo or redo reverses. Null for each other transaction.
  """
  undoes: ID

  """
  The update of each node that the transaction changed and that the filter keeps.
  """
  updates(
    """
    The filter of the updates. An update stays when its node matches. Atoms: #tag, @actor, ^id, %column, ~type, and a kanban:// URI. ^id takes a ULID, a short id (^short or ^^short), or the title slug of a task, for example ^fix-login-bug; it matches each task with that id or title slug, and the tasks of the board that depend on one of them. A virtual tag, for example #READY, is also a #tag atom. Join atoms with && (or a space), ||, and !, and group them with ( ). No filter in history and changes keeps each update, except the updates of a deleted task: of these, only its delete stays. No filter in Change.updates keeps each update of the change.
    """
    filter: String
  ): [NodeUpdate!]
}

"""
The change of one node in a transaction: how it changed, and each field that changed.
"""
type NodeUpdate {
  """The full kanban:// URI of the node, also for a deleted node."""
  id: ID!

  """The type of the node."""
  type: NodeType!

  """How the transaction changed the node."""
  kind: UpdateKind!

  """
  The change of each tracked field of the node that changed. The tracked fields are body and deleted, and: the name, model, and summary of a board; the name and order of a column; the name, color, and avatar of an actor; the name and color of a tag; the title, column, ordinal, assignees, tags, dependsOn, blockedBy, unresolvedDependsOn, ready, virtualTags, progress, started, and completed of a task; the task and author of a comment. Each other field is not tracked, for example created, updated, taskCount, and readyCount.
  """
  fields: [FieldChange!]!

  """
  The node now. A deleted node gives its tombstone, with deleted set. Null when the board does not have the node now.
  """
  node: Node
}

"""
The change of one tracked field of a node. A single value gives before and after, a list gives added and removed, and body gives diff. The values are the values that a query shows.
"""
type FieldChange {
  """The name of the field, for example column, tags, or ready."""
  name: String!

  """
  The value before the transaction, or null when it had no value. Null for a list field and for body.
  """
  before: JSON

  """
  The value after the transaction, or null when it has no value. Null for a list field and for body.
  """
  after: JSON

  """
  The items that the transaction added to a list field. Null for a single value.
  """
  added: [JSON!]

  """
  The items that the transaction removed from a list field. Null for a single value.
  """
  removed: [JSON!]

  """
  The unified diff from the body before the transaction to the body after it. Null for each field that is not body. Select node { body } for the full text.
  """
  diff: String
}

"""The field of a task that holds a stored link."""
enum LinkField {
  """A dependsOn edge of the task."""
  DEPENDS_ON

  """An assignee that is the full URI of an actor of a different board."""
  ASSIGNEE

  """A task URL in the body of a live task."""
  BODY

  """
  The line of the tombstone of a moved task that points to the task that the move made.
  """
  TOMBSTONE
}

"""The class of a stored link."""
enum LinkStatus {
  """
  The link names its board by a current name, and the board has the node, or the board cannot be read.
  """
  OK

  """
  The link names its board by an old name, and the board has the node or cannot be read.
  """
  OLD_NAME

  """No reachable board has the name of the link."""
  DANGLING

  """The board of the link is found, and the board does not have the node."""
  MISSING_NODE
}

"""One stored link of a task, and its class."""
type LinkCheck {
  """The current key of the board that holds the link."""
  board: String!

  """The full URI of the task that holds the link."""
  node: ID!

  """
  Where the task holds the link: DEPENDS_ON, ASSIGNEE, BODY (a task URL in the body), or TOMBSTONE (the line of a moved task).
  """
  field: LinkField!

  """The link as the board stores it: a full kanban:// URI."""
  target: String!

  """
  OK: the board and the node are found. OLD_NAME: the link names the board by an old name; currentName gives the name now. DANGLING: no reachable board has the name. MISSING_NODE: the board is found, the node is not.
  """
  status: LinkStatus!

  """
  The current key of the board that the link names. Null for a DANGLING link.
  """
  currentName: String
}

"""
The fields of initBoard and updateBoard. A name, model, or body that is not set does not change, and null clears it.
"""
input BoardInput {
  """The name of the board."""
  name: String

  """
